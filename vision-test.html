
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手書き資料 AI読み取りテスト</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
    }
    main {
      max-width: 650px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
    }
    h1 { font-size: 22px; }
    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 16px;
    }
    button {
      background: #1769aa;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled {
      background: #999;
      cursor: wait;
    }
    img {
      max-width: 100%;
      max-height: 350px;
      margin-top: 15px;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f0f3f7;
      padding: 15px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
<main>
  <h1>手書き資料 AI読み取りテスト</h1>
  <p>写真を1枚選択し、AIが内容を読み取れるか確認します。</p>

  <label for="code">テスト用認証番号</label>
  <input id="code" type="password" autocomplete="off">

  <label for="photo">資料を選択・撮影</label>
<input id="photo" type="file"
       accept="image/png,image/jpeg,application/pdf">

  <img id="preview" alt="選択した画像" hidden>

  <button id="send" type="button">AIで読み取る</button>

  <h2>読み取り結果</h2>
  <pre id="result">まだ実行していません。</pre>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const API_URL =
  "https://pdf-vision-test.oitajoho.workers.dev/test";

// PDFの指定ページをJPEG画像に変換する
async function pdfToImage(file, pageNumber = 1) {
  const data = new Uint8Array(await file.arrayBuffer());

  const pdf = await pdfjsLib.getDocument({
    data: data
  }).promise;

  try {
    const page = await pdf.getPage(pageNumber);

    const viewport = page.getViewport({
      scale: 1.5
    });

    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");

    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);

    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;

    return new Promise((resolve, reject) => {
      canvas.toBlob(
        (blob) => {
          if (!blob) {
            reject(new Error("PDFの画像変換に失敗しました。"));
            return;
          }

          resolve(blob);
        },
        "image/jpeg",
        0.85
      );
    });
  } finally {
    await pdf.destroy();
  }
}
  
const photo = document.getElementById("photo");
const preview = document.getElementById("preview");
const send = document.getElementById("send");
const result = document.getElementById("result");

photo.addEventListener("change", () => {
  const file = photo.files[0];

  preview.hidden = true;
  preview.removeAttribute("src");

  if (!file) return;

  if (file.type === "application/pdf") {
    result.textContent =
      "PDFを選択しました：" + file.name +
      "\nPDFの読み取り処理は、これから追加します。";
    return;
  }

  if (file.type.startsWith("image/")) {
    const url = URL.createObjectURL(file);
    preview.onload = () => URL.revokeObjectURL(url);
    preview.src = url;
    preview.hidden = false;
  }
});

send.addEventListener("click", async () => {
  const code = document.getElementById("code").value;
  const file = photo.files[0];

  if (!code) {
    result.textContent = "認証番号を入力してください。";
    return;
  }

  if (!file) {
    result.textContent = "写真を選択してください。";
    return;
  }

  if (!["image/png", "image/jpeg", "application/pdf"].includes(file.type)) {
  result.textContent = "PNG・JPEG・PDFを選択してください。";
  return;
}

send.disabled = true;
result.textContent = "資料を処理しています...";

let uploadFile = file;

try {
  if (file.type === "application/pdf") {
    uploadFile = await pdfToImage(file, 1);
  }

  if (uploadFile.size === 0 || uploadFile.size > 5 * 1024 * 1024) {
    result.textContent = "送信する画像は5MB以下にしてください。";
    return;
  }
} catch (error) {
  result.textContent = "PDFの変換に失敗しました。\n" + error.message;
  return;
} finally {
  send.disabled = false;
}

send.disabled = true;
result.textContent = "AIが画像を読み取っています...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "X-Test-Code": code,
        "Content-Type": uploadFile.type
      },
      body: uploadFile
    });

    const text = await response.text();

    if (!response.ok) {
      result.textContent =
        "HTTP " + response.status + "\n" + text;
      return;
    }

    let data;
    try {
      data = JSON.parse(text);
    } catch {
      result.textContent = text;
      return;
    }

    const content =
      data?.response ??
      data?.choices?.[0]?.message?.content;

    result.textContent =
      typeof content === "string"
        ? content
        : JSON.stringify(data, null, 2);

  } catch (error) {
    result.textContent =
      "通信に失敗しました。\n" +
      "Cloudflare WorkerのCORS設定などを確認してください。\n" +
      error.message;
  } finally {
    send.disabled = false;
  }
});
</script>
</body>
</html>
