
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探究イラスト作成</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f0f5fa;
  font-family: "Meiryo", sans-serif;
  color: #243449;
}
header {
  background: #174b80;
  color: white;
  text-align: center;
  padding: 25px 15px;
}
header h1 { margin: 0 0 8px; font-size: 24px; }
main { max-width: 700px; margin: 25px auto; padding: 0 15px; }
section {
  background: white;
  padding: 24px;
  border-radius: 12px;
  margin-bottom: 20px;
}
h2 { font-size: 19px; }
label { display: block; margin: 15px 0 7px; font-weight: bold; }
input, select, button {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border-radius: 7px;
}
input, select { border: 1px solid #b5c5d5; }
button {
  background: #1769aa;
  color: white;
  border: none;
  margin-top: 18px;
  cursor: pointer;
}
button:disabled { background: #a4b0bc; cursor: not-allowed; }
.note { color: #657487; font-size: 13px; }
#message { margin-top: 15px; font-weight: bold; }
#studentArea { display: none; }
#result {
  padding: 30px;
  background: #f4f7fb;
  text-align: center;
  border: 2px dashed #bdccdc;
}
</style>
</head>
<body>

<header>
  <h1>探究イラスト作成</h1>
  <p>あなたのアイデアを1枚のイラストにしよう</p>
</header>

<main>
<section>
  <h2>① 利用認証</h2>

  <label for="studentId">生徒番号（4桁）</label>
  <input id="studentId" maxlength="4"
         inputmode="numeric" placeholder="例：1101">

  <label for="authCode">認証番号（6桁）</label>
  <input id="authCode" type="password"
         maxlength="6" inputmode="numeric"
         placeholder="先生から配布された番号">

  <button id="authBtn" type="button">認証して開始</button>
  <p id="message" role="status"></p>
</section>

<div id="studentArea">
  <section>
    <h2>② PDFをアップロード</h2>
    <input id="pdfFile" type="file"
           accept=".pdf,application/pdf">
    <p class="note">2～3ページのPDFを選択してください。</p>
  </section>

  <section>
    <h2>③ 画像のタッチ</h2>
    <select id="style">
      <option value="future">SF・未来技術風（基本設定）</option>
      <option value="anime">アニメ風</option>
      <option value="real">写実・リアル風</option>
      <option value="3d">3Dアニメ風</option>
      <option value="watercolor">水彩画風</option>
      <option value="simple">シンプルなイラスト風</option>
    </select>
  </section>

  <section>
  <h2>④ イラスト作成</h2>
  <button id="generateBtn" type="button" disabled>
    イラストを生成する
  </button>
  <p id="generateStatus" class="note">
    PDFを選択すると生成できます。
  </p>
</section>

  <section>
    <h2>⑤ 生成結果</h2>
    <div id="result">ここに画像が表示されます。</div>
  </section>
</div>
</main>

<script>
const API = "https://pdf-illustration.oitajoho.workers.dev";

document.getElementById("authBtn").addEventListener("click", async () => {
  const studentId = document.getElementById("studentId").value.trim();
  const code = document.getElementById("authCode").value.trim();
  const message = document.getElementById("message");
  const button = document.getElementById("authBtn");

  document.getElementById("studentArea").style.display = "none";

  if (!/^\d{4}$/.test(studentId)) {
    message.textContent = "生徒番号は4桁で入力してください。";
    return;
  }
  if (!/^\d{6}$/.test(code)) {
    message.textContent = "認証番号は6桁で入力してください。";
    return;
  }

  button.disabled = true;
  message.textContent = "認証中です…";

  try {
    const response = await fetch(API + "/auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code })
    });

    const result = await response.json();

    if (result.success) {
      message.textContent = "認証に成功しました。";
      document.getElementById("studentArea").style.display = "block";
    } else {
      message.textContent = result.message || "認証に失敗しました。";
    }
  } catch (error) {
    message.textContent =
      "通信できませんでした。Cloudflare側の接続設定を確認してください。";
  } finally {
    button.disabled = false;
  }
});
  // PDF選択時に生成ボタンを有効にする
document.getElementById("pdfFile")
  .addEventListener("change", () => {

    const file =
      document.getElementById("pdfFile").files[0];

    const generateBtn =
      document.getElementById("generateBtn");

    const generateStatus =
      document.getElementById("generateStatus");

    if (file && file.type === "application/pdf") {
      generateBtn.disabled = false;
      generateStatus.textContent =
        "PDFを選択しました。イラストを生成できます。";
    } else {
      generateBtn.disabled = true;
      generateStatus.textContent =
        "PDFファイルを選択してください。";
    }
  });
</script>
  </script>
</body>
</html>
</body>
</html>
