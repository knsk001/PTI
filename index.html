
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探究イラスト作成</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f0f5fa;
  font-family: "Meiryo", sans-serif;
  color: #243449;
}
header {
  background: #174b80;
  color: white;
  text-align: center;
  padding: 25px 15px;
}
header h1 { margin: 0 0 8px; font-size: 24px; }
main { max-width: 700px; margin: 25px auto; padding: 0 15px; }
section {
  background: white;
  padding: 24px;
  border-radius: 12px;
  margin-bottom: 20px;
}
h2 { font-size: 19px; }
label { display: block; margin: 15px 0 7px; font-weight: bold; }
input, select, button {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border-radius: 7px;
}
input, select { border: 1px solid #b5c5d5; }
button {
  background: #1769aa;
  color: white;
  border: none;
  margin-top: 18px;
  cursor: pointer;
}
button:disabled { background: #a4b0bc; cursor: not-allowed; }
.note { color: #657487; font-size: 13px; }
#message { margin-top: 15px; font-weight: bold; }
#studentArea { display: none; }
#result {
  padding: 30px;
  background: #f4f7fb;
  text-align: center;
  border: 2px dashed #bdccdc;
}
</style>
</head>
<body>

<header>
  <h1>探究イラスト作成</h1>
  <p>あなたのアイデアを1枚のイラストにしよう</p>
</header>

<main>
<section>
  <h2>① 利用認証</h2>

  <label for="studentId">生徒番号（4桁）</label>
  <input id="studentId" maxlength="4"
         inputmode="numeric" placeholder="例：1101">

  <label for="authCode">認証番号（6桁）</label>
  <input id="authCode" type="password"
         maxlength="6" inputmode="numeric"
         placeholder="先生から配布された番号">

  <button id="authBtn" type="button">認証して開始</button>
  <p id="message" role="status"></p>
</section>

<div id="studentArea">
  <section>
    <h2>② PDFをアップロード</h2>
    <input id="pdfFile" type="file"
           accept=".pdf,application/pdf">
    <p class="note">2～3ページのPDFを選択してください。</p>
  </section>

  <section>
    <h2>③ 画像のタッチ</h2>
    <select id="style">
      <option value="future">SF・未来技術風（基本設定）</option>
      <option value="anime">アニメ風</option>
      <option value="real">写実・リアル風</option>
      <option value="3d">3Dアニメ風</option>
      <option value="watercolor">水彩画風</option>
      <option value="simple">シンプルなイラスト風</option>
    </select>
  </section>

  <section>
  <h2>④ イラスト作成</h2>
  <button id="generateBtn" type="button" disabled>
    イラストを生成する
  </button>
  <p id="generateStatus" class="note">
    PDFを選択すると生成できます。
  </p>
</section>

  <section>
    <h2>⑤ 生成結果</h2>
    <div id="result">ここに画像が表示されます。</div>
  </section>
</div>
</main>

<script>
const API = "https://pdf-illustration.oitajoho.workers.dev";

document.getElementById("authBtn").addEventListener("click", async () => {
  const studentId = document.getElementById("studentId").value.trim();
  const code = document.getElementById("authCode").value.trim();
  const message = document.getElementById("message");
  const button = document.getElementById("authBtn");

  document.getElementById("studentArea").style.display = "none";

  if (!/^\d{4}$/.test(studentId)) {
    message.textContent = "生徒番号は4桁で入力してください。";
    return;
  }
  if (!/^\d{6}$/.test(code)) {
    message.textContent = "認証番号は6桁で入力してください。";
    return;
  }

  button.disabled = true;
  message.textContent = "認証中です…";

  try {
    const response = await fetch(API + "/auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code })
    });

    const result = await response.json();

    if (result.success) {
      message.textContent = "認証に成功しました。";
      document.getElementById("studentArea").style.display = "block";
    } else {
      message.textContent = result.message || "認証に失敗しました。";
    }
  } catch (error) {
    message.textContent =
      "通信できませんでした。Cloudflare側の接続設定を確認してください。";
  } finally {
    button.disabled = false;
  }
});
  // PDF選択時に生成ボタンを有効にする
document.getElementById("pdfFile")
  .addEventListener("change", () => {

    const file =
      document.getElementById("pdfFile").files[0];

    const generateBtn =
      document.getElementById("generateBtn");

    const generateStatus =
      document.getElementById("generateStatus");

    if (file && file.type === "application/pdf") {
      generateBtn.disabled = false;
      generateStatus.textContent =
        "PDFを選択しました。イラストを生成できます。";
    } else {
      generateBtn.disabled = true;
      generateStatus.textContent =
        "PDFファイルを選択してください。";
    }
  });
  // PDFの1ページ目をJPEG画像に変換する
async function convertPdfToImage(file) {

  const arrayBuffer = await file.arrayBuffer();

  const pdf = await pdfjsLib.getDocument({
    data: arrayBuffer
  }).promise;

  const page = await pdf.getPage(1);

  const viewport = page.getViewport({
    scale: 1.5
  });

  const canvas = document.createElement("canvas");
  const context = canvas.getContext("2d");

  canvas.width = Math.ceil(viewport.width);
  canvas.height = Math.ceil(viewport.height);

  await page.render({
    canvasContext: context,
    viewport: viewport
  }).promise;

  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (blob) {
        resolve(blob);
      } else {
        reject(new Error("PDFの画像変換に失敗しました。"));
      }
    }, "image/jpeg", 0.85);
  });
}
// 画像生成ボタンを押したときの処理
document.getElementById("generateBtn")
  .addEventListener("click", async () => {

    const button = document.getElementById("generateBtn");
    const status = document.getElementById("generateStatus");
    const result = document.getElementById("result");

    const file = document.getElementById("pdfFile").files[0];
    const studentId = document.getElementById("studentId").value.trim();
    const code = document.getElementById("authCode").value.trim();
    const style = document.getElementById("style").value;

    if (!file) {
      status.textContent = "PDFを選択してください。";
      return;
    }

    button.disabled = true;
    status.textContent = "PDFを読み取っています…";
    result.textContent = "イラストを作成しています。";

    try {
      // PDFの1ページ目をJPEG画像に変換
      const image = await convertPdfToImage(file);

      const formData = new FormData();
      formData.append("code", code);
      formData.append("studentId", studentId);
      formData.append("style", style);
      formData.append("image", image, "research.jpg");

      status.textContent = "AIがイラストを生成しています…";

      const response = await fetch(API + "/generate", {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.message || "画像生成に失敗しました。");
      }

      const blob = await response.blob();
      const imageUrl = URL.createObjectURL(blob);

      result.replaceChildren();

      const img = document.createElement("img");
      img.src = imageUrl;
      img.alt = "生成された探究イラスト";
      img.style.maxWidth = "100%";

      result.appendChild(img);

      status.textContent = "イラストが完成しました。";

    } catch (error) {
      status.textContent = error.message;
      result.textContent = "画像を生成できませんでした。";
    } finally {
      button.disabled = false;
    }
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</body>
</html>
